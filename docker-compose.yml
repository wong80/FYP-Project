# Online chiller-power forecasting stack (DESIGN.md §2).
#   cp .env.example .env   # then set the passwords
#   docker compose up -d --build
# Dashboard: http://localhost:3000   MLflow: http://localhost:5000 (localhost only)

x-app: &app
  build:
    context: ./service
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: chiller-forecast:local
  environment:
    DATABASE_URL: postgresql://chiller:${POSTGRES_PASSWORD}@db:5432/chiller
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_NAME: chiller-power
    FIREBASE_DB_URL: ${FIREBASE_DB_URL:-}
    FIREBASE_UID: ${FIREBASE_UID:-}
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_sa
  secrets:
    - firebase_sa
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: chiller
      POSTGRES_DB: chiller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiller -d chiller"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    <<: *app
    entrypoint: ["mlflow", "server"]
    command:
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://chiller:${POSTGRES_PASSWORD}@db:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: create tables and backfill history from the building-meter export.
  init:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ["chiller init-db && chiller ingest-excel /data/Combined.xlsx"]
    volumes:
      - ./Datasets:/data:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Hourly ingest + score, weekly train (service/crontab).
  scheduler:
    <<: *app
    entrypoint: ["supercronic", "-passthrough-logs", "/app/crontab"]
    command: []
    volumes:
      - ./Datasets:/data:ro     # for manual `chiller ingest-excel` re-runs
    depends_on:
      init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:          # T6: training can't starve the database
          cpus: "3"
          memory: 6g

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chiller-forecast.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

secrets:
  firebase_sa:
    # Real key: set FIREBASE_SA_FILE in .env. The placeholder is an empty JSON file.
    file: ${FIREBASE_SA_FILE:-./deploy/firebase-service-account.placeholder.json}

volumes:
  db-data:
  mlflow-artifacts:
  grafana-data:
