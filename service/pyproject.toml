[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chiller-forecast"
version = "0.1.0"
description = "Online chiller power forecasting with guarded weekly retraining"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandera>=0.22",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "google-auth>=2.30",
    "mlflow>=3.1",
    "mljar-supervised==1.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chiller = "chiller_forecast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chiller_forecast = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: trains a real MLJAR model (minutes)"]
addopts = "-m 'not slow'"
